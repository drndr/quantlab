[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Trading-strategy R&D and backtesting (long-only XAUUSD trend)"
readme = "README.md"
requires-python = ">=3.12"  # f-string syntax in reporting needs 3.12
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
fast = ["numba"]  # optional JIT for the backtest loop (pure-python fallback otherwise)
dev = ["pytest"]

[project.scripts]
quantlab-ui = "quantlab.webui.server:main"
quantlab-rnd = "quantlab.rnd:main"
quantlab-download = "quantlab.data.download:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
